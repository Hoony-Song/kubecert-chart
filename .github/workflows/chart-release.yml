name: Chart Release

on:
  workflow_dispatch:
  push:
    tags:
      - "kubecert-chart-v*"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: chart-release
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Package chart
        run: |
          scripts/release/package-chart.sh \
            --destination public \
            --repo-url "https://${{ github.repository_owner }}.github.io/kubecert-chart"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  publish:
    needs: package
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
