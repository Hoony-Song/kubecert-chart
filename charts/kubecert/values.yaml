      targetQueueLength: 1
      databaseIndex: 0
      enableTLS: false
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1Gi
  cleanup:
    enabled: true
    mode: cleanup
    replicas: 1
    terminationGracePeriodSeconds: 1200
    autoscaling:
      enabled: true
      minReplicas: 1
      maxReplicas: 5
      pollingIntervalSeconds: 5
      cooldownPeriodSeconds: 900
      scaleDownStabilizationSeconds: 900
      listName: kubecert:queue:cleanup
      targetQueueLength: 1
      databaseIndex: 0
      enableTLS: false
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

