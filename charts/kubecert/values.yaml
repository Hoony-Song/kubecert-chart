      targetQueueLength: 1
      databaseIndex: 0
      enableTLS: false
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1Gi
  grade:
    enabled: true
    mode: grade
    replicas: 2
    terminationGracePeriodSeconds: 600
    autoscaling:
      enabled: true
      minReplicas: 1
      maxReplicas: 5
      pollingIntervalSeconds: 5
      cooldownPeriodSeconds: 300
      scaleDownStabilizationSeconds: 300
