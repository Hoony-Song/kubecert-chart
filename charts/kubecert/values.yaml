config:
  corsOrigins: []
  publicApiUrl: ""
  allowInsecurePublicApiUrl: false
  frontend:
    examApiBaseUrl: ""
    adminApiBaseUrl: ""
    terminalHost: ""
    terminalWsBaseUrl: ""
  backend:
    bcryptRounds: 12
    accessTokenExpireMinutes: 720
    sessionTtlSeconds: 7200
    sessionGraceSeconds: 300
    cleanupIntervalSeconds: 60
    examDurationMinutes: 120
    unstartedSessionTtlHours: 24
    expirySweepIntervalSeconds: 30
    gradeThreads: 5
    sessionThreads: 2
    autoDbInit: false
    autoSeed: false
    seedRuntimeNodes: false
    initialAdminPasswordReset: false
    topologyMode: auto
    topologyStrict: false
    nodesConfigPath: /app/config/runtime-nodes.yaml
    provisionWaitSeconds: 600
    provisionPollSeconds: 5
    provisionRecoverRunningAfterSeconds: 900
    provisionTransportRetries: 3
    provisionTransportRetrySeconds: 10
    existingProvisionWaitSeconds: 1800
    existingProvisionPollSeconds: 10
    existingProvisionStaleSeconds: 120
    questionSnapshotMode: file
    questionSnapshotRefreshSeconds: 60
    questionSnapshotIncludePreview: false
  runtime:
    backendEnableSsh: true
  terminal:
    enabled: true
    sshUser: ubuntu
    sshPort: 22
    allowedOrigins: []

r2:
  enabled: false
  publicBaseUrl: ""
  endpointUrl: ""
  bucket: ""
  region: auto
  forcePathStyle: true
  auth:
    name: ""
    existingSecret: ""
    accessKeyIdKey: access-key-id
    secretAccessKeyKey: secret-access-key

secrets:
  admin:
    create: false
    name: ""
    existingSecret: ""
    usernameKey: username
    passwordKey: password
    username: admin
    password: ""
  runtimeSsh:
    autoGenerate: true
    name: ""
    existingSecret: ""
    privateKeyKey: id_ed25519
    publicKeyKey: id_ed25519.pub
  terminalSsh:
    autoGenerate: true
    name: ""
    existingSecret: ""
    privateKeyKey: runtime_admin_key
    publicKeyKey: runtime_admin_key.pub

postgresql:
  enabled: true
  mode: bundled
  auth:
    create: false
    name: ""
    existingSecret: ""
    username: kubecert
    database: kubecert
    passwordKey: password
    password: ""
    secretKeys:
      adminPasswordKey: postgres-password
      userPasswordKey: password
      replicationPasswordKey: replication-password
  bundled:
    host: ""
    port: 5432
    persistence:
      enabled: true
      size: 10Gi
  primary:
    persistence:
      enabled: true
      size: 10Gi
  external:
    host: ""
    port: 5432

redis:
  enabled: true
  mode: bundled
  architecture: standalone
  database: "0"
  auth:
    enabled: true
    create: false
    name: ""
    existingSecret: ""
    existingSecretPasswordKey: ""
    passwordKey: redis-password
    password: ""
  bundled:
    host: ""
    port: 6379
    persistence:
      enabled: true
      size: 8Gi
  master:
    persistence:
      enabled: true
      size: 8Gi
  external:
    host: ""
    port: 6379

kedaOperator:
  enabled: true
  crds:
    install: false

keda:
  mode: bundled
  namespace: ""
  triggerAuthenticationName: ""

migrations:
  enabled: true
  ttlSecondsAfterFinished: 600
  backoffLimit: 6

seed:
  enabled: true
  ttlSecondsAfterFinished: 600
  backoffLimit: 6

questionBank:
  enabled: true
  mode: artifact
  claimName: ""
  mountPath: /data/question-bank
  version: v20260527-cka-q002-q017-r2
  artifactUrl: https://artifacts.sweetlabs.kr/question-bank/kubecert-question-bank-v20260527-cka-q002-q017-r2.tar.gz
  artifactSha256: 33173d173cef061d7ee73d62ebf16458efd55a2238a7af42285847d0c5193572
  persistence:
    create: true
    existingClaim: ""
    storageClassName: ""
    storageSize: 1Gi
    accessModes:
      - ReadWriteMany
  sync:
    enabled: true
    ttlSecondsAfterFinished: 600
    backoffLimit: 3

api:
  replicas: 2
  port: 8000
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

