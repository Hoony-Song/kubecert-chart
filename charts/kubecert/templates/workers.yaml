{{- $root := . -}}
{{- $workers := list
  (dict "role" "provision" "config" .Values.workers.provision)
  (dict "role" "grade" "config" .Values.workers.grade)
  (dict "role" "cleanup" "config" .Values.workers.cleanup)
-}}
{{- range $item := $workers }}
{{- $role := $item.role -}}
{{- $worker := $item.config -}}
{{- if $worker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kubecert.workerName" $root }}-{{ $role }}
  labels:
    {{- include "kubecert.labels" $root | nindent 4 }}
    app.kubernetes.io/name: {{ include "kubecert.workerName" $root }}-{{ $role }}
    app.kubernetes.io/component: worker
    app.kubernetes.io/role: {{ $role }}
spec:
  {{- if and (ne $root.Values.keda.mode "disabled") $worker.autoscaling.enabled }}
  replicas: {{ $worker.autoscaling.minReplicas }}
  {{- else }}
  replicas: {{ $worker.replicas }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "kubecert.workerName" $root }}-{{ $role }}
      app.kubernetes.io/component: worker
      app.kubernetes.io/role: {{ $role }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "kubecert.workerName" $root }}-{{ $role }}
        app.kubernetes.io/component: worker
        app.kubernetes.io/role: {{ $role }}
        {{- include "kubecert.selectorLabels" $root | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: {{ $worker.terminationGracePeriodSeconds }}
      {{- include "kubecert.imagePullSecrets" $root | nindent 6 }}
      {{- include "kubecert.waitForDependenciesInitContainers" $root | nindent 6 }}
      containers:
        - name: worker
          image: {{ include "kubecert.image" (dict "root" $root "image" $root.Values.images.worker) | quote }}
          imagePullPolicy: {{ $root.Values.images.worker.pullPolicy }}
          command:
            - python
            - -m
            - app.worker_runner
          envFrom:
            - configMapRef:
                name: {{ include "kubecert.configMapName" $root }}
          env:
            {{- include "kubecert.databaseEnv" $root | nindent 12 }}
            {{- include "kubecert.redisEnv" $root | nindent 12 }}
            - name: CERT_WORKER_MODE
              value: {{ $worker.mode | quote }}
          volumeMounts:
            - name: runtime-ssh-key
              mountPath: /etc/cert/runtime
              readOnly: true
            {{- if $root.Values.questionBank.enabled }}
            - name: question-bank
              mountPath: {{ $root.Values.questionBank.mountPath }}
              readOnly: true
            {{- end }}
          resources:
            {{- toYaml $worker.resources | nindent 12 }}
      volumes:
        - name: runtime-ssh-key
          secret:
            secretName: {{ include "kubecert.runtimeSshSecretName" $root }}
            defaultMode: 0400
        {{- if $root.Values.questionBank.enabled }}
        - name: question-bank
          persistentVolumeClaim:
            claimName: {{ include "kubecert.questionBankClaimName" $root }}
        {{- end }}
---
{{- end }}
{{- end }}
