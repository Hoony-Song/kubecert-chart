apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kubecert.examWebName" . }}
  labels:
    {{- include "kubecert.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ include "kubecert.examWebName" . }}
    app.kubernetes.io/component: exam-web
spec:
  replicas: {{ .Values.examWeb.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "kubecert.examWebName" . }}
      app.kubernetes.io/component: exam-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "kubecert.examWebName" . }}
        app.kubernetes.io/component: exam-web
        {{- include "kubecert.selectorLabels" . | nindent 8 }}
    spec:
      {{- include "kubecert.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: exam-web
          image: {{ include "kubecert.image" (dict "root" . "image" .Values.images.examWeb) | quote }}
          imagePullPolicy: {{ .Values.images.examWeb.pullPolicy }}
          env:
            - name: CERT_FRONTEND_API_BASE_URL
              value: {{ include "kubecert.examApiBaseUrl" . | quote }}
            - name: CERT_TERMINAL_WS_BASE_URL
              value: {{ include "kubecert.terminalWsBaseUrl" . | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.examWeb.port }}
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http
          resources:
            {{- toYaml .Values.examWeb.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kubecert.examWebName" . }}
  labels:
    {{- include "kubecert.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ include "kubecert.examWebName" . }}
    app.kubernetes.io/component: exam-web
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "kubecert.examWebName" . }}
    app.kubernetes.io/component: exam-web
  ports:
    - name: http
      port: 80
      targetPort: http
---
