{{- if .Values.migrations.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "kubecert.fullname" . }}-db-migrate
  labels:
    {{- include "kubecert.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-20"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: {{ .Values.migrations.backoffLimit }}
  ttlSecondsAfterFinished: {{ .Values.migrations.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: OnFailure
      {{- include "kubecert.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: migrate
          image: {{ include "kubecert.image" (dict "root" . "image" .Values.images.api) | quote }}
          imagePullPolicy: {{ .Values.images.api.pullPolicy }}
          command:
            - /bin/sh
            - -ec
            - |
              for i in $(seq 1 60); do
                if python -m app.migration_adopt && alembic upgrade head; then
                  exit 0
                fi
                sleep 5
              done
              python -m app.migration_adopt
              alembic upgrade head
          env:
            {{- include "kubecert.databaseEnv" . | nindent 12 }}
            {{- include "kubecert.r2Env" . | nindent 12 }}
---
{{- end }}
{{- if .Values.seed.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "kubecert.fullname" . }}-db-seed
  labels:
    {{- include "kubecert.labels" . | nindent 4 }}
    app.kubernetes.io/component: seed
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: {{ .Values.seed.backoffLimit }}
  ttlSecondsAfterFinished: {{ .Values.seed.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: seed
    spec:
      restartPolicy: OnFailure
      {{- include "kubecert.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: seed
          image: {{ include "kubecert.image" (dict "root" . "image" .Values.images.api) | quote }}
          imagePullPolicy: {{ .Values.images.api.pullPolicy }}
          command:
            - /bin/sh
            - -ec
            - |
              for i in $(seq 1 60); do
                if python -m app.seed; then
                  exit 0
                fi
                sleep 5
              done
              python -m app.seed
          envFrom:
            - configMapRef:
                name: {{ include "kubecert.configMapName" . }}
          env:
            {{- include "kubecert.databaseEnv" . | nindent 12 }}
            {{- include "kubecert.r2Env" . | nindent 12 }}
            - name: CERT_INITIAL_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "kubecert.adminSecretName" . }}
                  key: {{ .Values.secrets.admin.usernameKey }}
            - name: CERT_INITIAL_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "kubecert.adminSecretName" . }}
                  key: {{ .Values.secrets.admin.passwordKey }}
{{- end }}
