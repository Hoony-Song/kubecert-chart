{{- $appSecretName := include "kubecert.appSecretName" . -}}
{{- $appSecretKey := "jwt-secret" -}}
{{- $existingAppSecret := lookup "v1" "Secret" .Release.Namespace $appSecretName -}}
{{- $jwtSecret := "" -}}
{{- if and $existingAppSecret (hasKey $existingAppSecret.data $appSecretKey) -}}
{{- $jwtSecret = index $existingAppSecret.data $appSecretKey -}}
{{- else -}}
{{- $jwtSecret = randAlphaNum 64 | b64enc -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $appSecretName }}
  labels:
    {{- include "kubecert.labels" . | nindent 4 }}
type: Opaque
data:
  {{ $appSecretKey }}: {{ $jwtSecret | quote }}
---
{{- if .Values.secrets.admin.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kubecert.adminSecretName" . }}
  labels:
    {{- include "kubecert.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.secrets.admin.usernameKey }}: {{ .Values.secrets.admin.username | quote }}
  {{ .Values.secrets.admin.passwordKey }}: {{ required "secrets.admin.password is required when secrets.admin.create=true" .Values.secrets.admin.password | quote }}
---
{{- end }}
{{- if .Values.postgresql.auth.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kubecert.postgresqlSecretName" . }}
  labels:
    {{- include "kubecert.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.postgresql.auth.passwordKey }}: {{ required "postgresql.auth.password is required when postgresql.auth.create=true" .Values.postgresql.auth.password | quote }}
---
{{- end }}
{{- if and .Values.redis.auth.enabled .Values.redis.auth.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kubecert.redisSecretName" . }}
  labels:
    {{- include "kubecert.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ coalesce .Values.redis.auth.passwordKey .Values.redis.auth.existingSecretPasswordKey "redis-password" }}: {{ required "redis.auth.password is required when redis.auth.create=true" .Values.redis.auth.password | quote }}
---
{{- end }}
{{- if .Values.secrets.runtimeSsh.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kubecert.runtimeSshSecretName" . }}
  labels:
    {{- include "kubecert.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.secrets.runtimeSsh.privateKeyKey }}: {{ required "secrets.runtimeSsh.privateKeyValue is required when secrets.runtimeSsh.create=true" .Values.secrets.runtimeSsh.privateKeyValue | quote }}
  {{ .Values.secrets.runtimeSsh.publicKeyKey }}: {{ required "secrets.runtimeSsh.publicKeyValue is required when secrets.runtimeSsh.create=true" .Values.secrets.runtimeSsh.publicKeyValue | quote }}
---
{{- end }}
{{- if .Values.secrets.terminalSsh.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kubecert.terminalSshSecretName" . }}
  labels:
    {{- include "kubecert.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.secrets.terminalSsh.privateKeyKey }}: {{ required "secrets.terminalSsh.privateKeyValue is required when secrets.terminalSsh.create=true" .Values.secrets.terminalSsh.privateKeyValue | quote }}
  {{ .Values.secrets.terminalSsh.publicKeyKey }}: {{ required "secrets.terminalSsh.publicKeyValue is required when secrets.terminalSsh.create=true" .Values.secrets.terminalSsh.publicKeyValue | quote }}
---
{{- end }}
{{- if .Values.r2.auth.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kubecert.r2SecretName" . }}
  labels:
    {{- include "kubecert.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.r2.auth.accessKeyIdKey }}: {{ required "r2.auth.accessKeyIdValue is required when r2.auth.create=true" .Values.r2.auth.accessKeyIdValue | quote }}
  {{ .Values.r2.auth.secretAccessKeyKey }}: {{ required "r2.auth.secretAccessKeyValue is required when r2.auth.create=true" .Values.r2.auth.secretAccessKeyValue | quote }}
{{- end }}
