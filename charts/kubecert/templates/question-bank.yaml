{{- if .Values.questionBank.enabled }}
{{- if and .Values.questionBank.persistence.create (not .Values.questionBank.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "kubecert.questionBankClaimName" . }}
  labels:
    {{- include "kubecert.labels" . | nindent 4 }}
    app.kubernetes.io/component: question-bank
spec:
  accessModes:
    {{- toYaml .Values.questionBank.persistence.accessModes | nindent 4 }}
  resources:
    requests:
      storage: {{ .Values.questionBank.persistence.storageSize | quote }}
  {{- if .Values.questionBank.persistence.storageClassName }}
  storageClassName: {{ .Values.questionBank.persistence.storageClassName | quote }}
  {{- end }}
---
{{- end }}
{{- if and .Values.questionBank.sync.enabled (eq .Values.questionBank.mode "artifact") }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kubecert.fullname" . }}-question-bank-sync
  labels:
    {{- include "kubecert.labels" . | nindent 4 }}
    app.kubernetes.io/component: question-bank
data:
  sync-question-bank.py: |
    from __future__ import annotations

    import hashlib
    import json
    import os
    import shutil
    import tarfile
    import tempfile
    import urllib.request
    from pathlib import Path

    USER_AGENT = "Mozilla/5.0 kubecert-question-bank-sync"

    def require(value: str, name: str) -> str:
        if not value:
            raise SystemExit(f"{name} is required")
        return value

    def download(url: str, dest: Path) -> None:
        request = urllib.request.Request(url, headers={"User-Agent": USER_AGENT})
        with urllib.request.urlopen(request, timeout=180) as response:
            dest.write_bytes(response.read())

    def sha256(path: Path) -> str:
        digest = hashlib.sha256()
        with path.open("rb") as handle:
            for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                digest.update(chunk)
        return digest.hexdigest()

    def safe_extract(archive: Path, target: Path) -> None:
        target_root = target.resolve()
        with tarfile.open(archive) as handle:
            for member in handle.getmembers():
                destination = (target / member.name).resolve()
                if not str(destination).startswith(str(target_root)):
                    raise SystemExit(f"unsafe archive path: {member.name}")
            handle.extractall(target)

    def artifact_from_manifest() -> tuple[str, str]:
        explicit = os.getenv("CERT_RUNTIME_NODE_MANIFEST_URL", "").strip()
        path = os.getenv("CERT_RUNTIME_NODE_MANIFEST_PATH", "").strip()
        base = os.getenv("CERT_ARTIFACT_BASE_URL", "").strip().rstrip("/")
        version = os.getenv("CERT_RUNTIME_ARTIFACT_VERSION", "").strip()
        if explicit:
            manifest_url = explicit
        elif path and base:
            manifest_url = f"{base}/{path.strip('/')}"
        elif base and version:
            manifest_url = f"{base}/runtime/manifests/runtime-node-{version}.json"
        else:
            return "", ""
        with tempfile.TemporaryDirectory() as raw_tmp:
            manifest_path = Path(raw_tmp) / "runtime-node.json"
            download(manifest_url, manifest_path)
            manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
        question_bank = manifest.get("questionBank") or {}
        return str(question_bank.get("url") or ""), str(question_bank.get("sha256") or "")

    target = Path(require(os.getenv("CERT_QUESTION_BANK_ROOT", ""), "CERT_QUESTION_BANK_ROOT"))
    artifact_url = os.getenv("CERT_QUESTION_BANK_ARTIFACT_URL", "").strip()
    expected_sha = os.getenv("CERT_QUESTION_BANK_ARTIFACT_SHA256", "").strip()
    if not artifact_url:
        artifact_url, expected_sha = artifact_from_manifest()
    artifact_url = require(artifact_url, "question-bank artifact URL")

    with tempfile.TemporaryDirectory() as tmpdir:
        archive = Path(tmpdir) / "question-bank.tar.gz"
        download(artifact_url, archive)
        if expected_sha:
            actual_sha = sha256(archive)
            if actual_sha != expected_sha:
                raise SystemExit(f"question-bank sha256 mismatch: {actual_sha} != {expected_sha}")
        extracted = Path(tmpdir) / "extract"
        extracted.mkdir()
        safe_extract(archive, extracted)
        target.mkdir(parents=True, exist_ok=True)
        for child in target.iterdir():
            if child.is_dir():
                shutil.rmtree(child)
            else:
                child.unlink()
        for child in extracted.iterdir():
            shutil.move(str(child), target / child.name)
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "kubecert.fullname" . }}-question-bank-sync
  labels:
    {{- include "kubecert.labels" . | nindent 4 }}
    app.kubernetes.io/component: question-bank
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "20"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: {{ .Values.questionBank.sync.backoffLimit }}
  ttlSecondsAfterFinished: {{ .Values.questionBank.sync.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: question-bank
    spec:
      restartPolicy: OnFailure
      {{- include "kubecert.imagePullSecrets" . | nindent 6 }}
      {{- include "kubecert.podScheduling" . | nindent 6 }}
      containers:
        - name: sync
          image: {{ include "kubecert.image" (dict "root" . "image" .Values.images.api) | quote }}
          imagePullPolicy: {{ .Values.images.api.pullPolicy }}
          command:
            - python
            - /etc/kubecert/question-bank/sync-question-bank.py
          envFrom:
            - configMapRef:
                name: {{ include "kubecert.configMapName" . }}
          env:
            - name: CERT_QUESTION_BANK_ARTIFACT_URL
              value: {{ .Values.questionBank.artifactUrl | quote }}
            - name: CERT_QUESTION_BANK_ARTIFACT_SHA256
              value: {{ .Values.questionBank.artifactSha256 | quote }}
            - name: CERT_QUESTION_BANK_ROOT
              value: {{ .Values.questionBank.mountPath | quote }}
            {{- include "kubecert.r2Env" . | nindent 12 }}
          volumeMounts:
            - name: sync-script
              mountPath: /etc/kubecert/question-bank
              readOnly: true
            - name: question-bank
              mountPath: {{ .Values.questionBank.mountPath }}
      volumes:
        - name: sync-script
          configMap:
            name: {{ include "kubecert.fullname" . }}-question-bank-sync
        - name: question-bank
          persistentVolumeClaim:
            claimName: {{ include "kubecert.questionBankClaimName" . }}
{{- end }}
{{- end }}
