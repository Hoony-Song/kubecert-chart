{{- $hasScaledObjectApi := .Capabilities.APIVersions.Has "keda.sh/v1alpha1/ScaledObject" -}}
{{- $hasTriggerAuthApi := .Capabilities.APIVersions.Has "keda.sh/v1alpha1/TriggerAuthentication" -}}
{{- $renderKedaObjects := false -}}
{{- if eq .Values.keda.mode "bundled" -}}
{{- $renderKedaObjects = true -}}
{{- else if eq .Values.keda.mode "external" -}}
{{- if not (and $hasScaledObjectApi $hasTriggerAuthApi) -}}
{{- fail "keda.mode=external requires KEDA CRDs to be installed before installing kubecert" -}}
{{- end -}}
{{- $renderKedaObjects = true -}}
{{- else -}}
{{- fail "keda.mode must be bundled or external" -}}
{{- end -}}
{{- if $renderKedaObjects }}
{{- $authName := default (printf "%s-worker-redis" (include "kubecert.fullname" .)) .Values.keda.triggerAuthenticationName -}}
{{- if .Values.redis.auth.enabled }}
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: {{ $authName }}
  labels:
    {{- include "kubecert.labels" . | nindent 4 }}
spec:
  secretTargetRef:
    - parameter: password
      name: {{ include "kubecert.redisSecretName" . }}
      key: {{ coalesce .Values.redis.auth.passwordKey .Values.redis.auth.existingSecretPasswordKey "redis-password" }}
---
{{- end }}
{{- $root := . -}}
{{- $workers := list
  (dict "role" "provision" "config" .Values.workers.provision)
  (dict "role" "grade" "config" .Values.workers.grade)
  (dict "role" "cleanup" "config" .Values.workers.cleanup)
-}}
{{- range $item := $workers }}
{{- $role := $item.role -}}
{{- $worker := $item.config -}}
{{- if and $worker.enabled $worker.autoscaling.enabled }}
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ include "kubecert.workerName" $root }}-{{ $role }}
  labels:
    {{- include "kubecert.labels" $root | nindent 4 }}
    app.kubernetes.io/component: worker
    app.kubernetes.io/role: {{ $role }}
spec:
  scaleTargetRef:
    name: {{ include "kubecert.workerName" $root }}-{{ $role }}
  pollingInterval: {{ $worker.autoscaling.pollingIntervalSeconds }}
  cooldownPeriod: {{ $worker.autoscaling.cooldownPeriodSeconds }}
  minReplicaCount: {{ $worker.autoscaling.minReplicas }}
  maxReplicaCount: {{ $worker.autoscaling.maxReplicas }}
  {{- if $worker.autoscaling.scaleDownStabilizationSeconds }}
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: {{ $worker.autoscaling.scaleDownStabilizationSeconds }}
  {{- end }}
  triggers:
    - type: redis
      metadata:
        address: {{ include "kubecert.redisAddress" $root | quote }}
        listName: {{ $worker.autoscaling.listName | quote }}
        listLength: {{ $worker.autoscaling.targetQueueLength | quote }}
        databaseIndex: {{ $worker.autoscaling.databaseIndex | quote }}
        enableTLS: {{ $worker.autoscaling.enableTLS | quote }}
      {{- if $root.Values.redis.auth.enabled }}
      authenticationRef:
        name: {{ $authName }}
      {{- end }}
---
{{- end }}
{{- end }}
{{- end }}
