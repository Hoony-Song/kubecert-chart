apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kubecert.configMapName" . }}
  labels:
    {{- include "kubecert.labels" . | nindent 4 }}
data:
  CERT_CORS_ORIGINS: {{ include "kubecert.corsOrigins" . | quote }}
  CERT_PUBLIC_API_URL: {{ include "kubecert.publicApiUrl" . | quote }}
  CERT_ALLOW_INSECURE_PUBLIC_API_URL: {{ include "kubecert.allowInsecurePublicApiUrl" . | quote }}
  {{- with .Values.config.artifactBaseUrl }}
  CERT_ARTIFACT_BASE_URL: {{ . | quote }}
  {{- end }}
  {{- with .Values.config.runtimeNodeInstallerUrl }}
  CERT_RUNTIME_NODE_INSTALLER_URL: {{ . | quote }}
  {{- end }}
  {{- with .Values.config.runtimeNodeManifestUrl }}
  CERT_RUNTIME_NODE_MANIFEST_URL: {{ . | quote }}
  {{- end }}
  CERT_FRONTEND_API_BASE_URL: {{ .Values.config.frontend.examApiBaseUrl | quote }}
  CERT_ADMIN_FRONTEND_API_BASE_URL: {{ .Values.config.frontend.adminApiBaseUrl | quote }}
  CERT_TERMINAL_HOST: {{ include "kubecert.terminalHost" . | quote }}
  CERT_TERMINAL_WS_BASE_URL: {{ include "kubecert.terminalWsBaseUrl" . | quote }}
  CERT_QUESTION_BANK_ROOT: {{ .Values.questionBank.mountPath | quote }}
  CERT_QUESTION_BANK_VERSION: {{ .Values.questionBank.version | quote }}
  CERT_QUESTION_BANK_ARTIFACT_URL: {{ .Values.questionBank.artifactUrl | quote }}
  CERT_QUESTION_BANK_ARTIFACT_SHA256: {{ .Values.questionBank.artifactSha256 | quote }}
  CERT_BACKEND_ENABLE_SSH: {{ .Values.config.runtime.backendEnableSsh | quote }}
  CERT_TERMINAL_ENABLED: {{ .Values.config.terminal.enabled | quote }}
  CERT_TERMINAL_SSH_USER: {{ .Values.config.terminal.sshUser | quote }}
  CERT_TERMINAL_SSH_PORT: {{ .Values.config.terminal.sshPort | quote }}
  CERT_TERMINAL_ALLOWED_ORIGINS: {{ include "kubecert.terminalAllowedOrigins" . | quote }}
  CERT_TOPOLOGY_MODE: {{ .Values.config.backend.topologyMode | quote }}
  CERT_TOPOLOGY_STRICT: {{ .Values.config.backend.topologyStrict | quote }}
  CERT_NODES_CONFIG_PATH: {{ .Values.config.backend.nodesConfigPath | quote }}
  CERT_WORKER_PROVISION_WAIT_SECONDS: {{ .Values.config.backend.provisionWaitSeconds | quote }}
  CERT_WORKER_PROVISION_POLL_SECONDS: {{ .Values.config.backend.provisionPollSeconds | quote }}
  CERT_WORKER_PROVISION_RECOVER_RUNNING_AFTER_SECONDS: {{ .Values.config.backend.provisionRecoverRunningAfterSeconds | quote }}
  CERT_WORKER_PROVISION_TRANSPORT_RETRIES: {{ .Values.config.backend.provisionTransportRetries | quote }}
  CERT_WORKER_PROVISION_TRANSPORT_RETRY_SECONDS: {{ .Values.config.backend.provisionTransportRetrySeconds | quote }}
  CERT_WORKER_EXISTING_PROVISION_WAIT_SECONDS: {{ .Values.config.backend.existingProvisionWaitSeconds | quote }}
  CERT_WORKER_EXISTING_PROVISION_POLL_SECONDS: {{ .Values.config.backend.existingProvisionPollSeconds | quote }}
  CERT_WORKER_EXISTING_PROVISION_STALE_SECONDS: {{ .Values.config.backend.existingProvisionStaleSeconds | quote }}
  CERT_QUESTION_SNAPSHOT_MODE: {{ .Values.config.backend.questionSnapshotMode | quote }}
  CERT_QUESTION_SNAPSHOT_REFRESH_SECONDS: {{ .Values.config.backend.questionSnapshotRefreshSeconds | quote }}
  CERT_QUESTION_SNAPSHOT_INCLUDE_PREVIEW: {{ .Values.config.backend.questionSnapshotIncludePreview | quote }}
  CERT_AUTO_DB_INIT: {{ .Values.config.backend.autoDbInit | quote }}
  CERT_AUTO_SEED: {{ .Values.config.backend.autoSeed | quote }}
  CERT_SEED_RUNTIME_NODES: {{ .Values.config.backend.seedRuntimeNodes | quote }}
  CERT_INITIAL_ADMIN_PASSWORD_RESET: {{ .Values.config.backend.initialAdminPasswordReset | quote }}
  CERT_BCRYPT_ROUNDS: {{ .Values.config.backend.bcryptRounds | quote }}
  CERT_ACCESS_TOKEN_EXPIRE_MINUTES: {{ .Values.config.backend.accessTokenExpireMinutes | quote }}
  CERT_SESSION_TTL_SECONDS: {{ .Values.config.backend.sessionTtlSeconds | quote }}
  CERT_SESSION_GRACE_SECONDS: {{ .Values.config.backend.sessionGraceSeconds | quote }}
  CERT_CLEANUP_INTERVAL_SECONDS: {{ .Values.config.backend.cleanupIntervalSeconds | quote }}
  CERT_GRADE_THREADS: {{ .Values.config.backend.gradeThreads | quote }}
  CERT_SESSION_THREADS: {{ .Values.config.backend.sessionThreads | quote }}
  CERT_R2_ENABLED: {{ .Values.r2.enabled | quote }}
  CERT_R2_PUBLIC_BASE_URL: {{ .Values.r2.publicBaseUrl | quote }}
  CERT_R2_ENDPOINT: {{ .Values.r2.endpointUrl | quote }}
  CERT_R2_BUCKET: {{ .Values.r2.bucket | quote }}
  CERT_R2_REGION: {{ .Values.r2.region | quote }}
  CERT_R2_FORCE_PATH_STYLE: {{ .Values.r2.forcePathStyle | quote }}
  R2_PUBLIC_BASE_URL: {{ .Values.r2.publicBaseUrl | quote }}
  R2_ENDPOINT: {{ .Values.r2.endpointUrl | quote }}
  R2_BUCKET: {{ .Values.r2.bucket | quote }}
  R2_REGION: {{ .Values.r2.region | quote }}
