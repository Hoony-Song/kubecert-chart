{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "kubecert.apiName" . }}
  labels:
    {{- include "kubecert.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "10"
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className | quote }}
  {{- end }}
  {{- if and .Values.ingress.tls.enabled .Values.ingress.tls.secretName }}
  tls:
    - secretName: {{ .Values.ingress.tls.secretName | quote }}
      hosts:
        - {{ .Values.ingress.hosts.api | quote }}
  {{- end }}
  rules:
    - host: {{ required "ingress.hosts.api is required when ingress.enabled=true" .Values.ingress.hosts.api | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "kubecert.apiName" . }}
                port:
                  name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "kubecert.terminalGatewayName" . }}
  labels:
    {{- include "kubecert.labels" . | nindent 4 }}
    app.kubernetes.io/component: terminal-gateway
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "10"
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className | quote }}
  {{- end }}
  rules:
    - host: {{ required "ingress.hosts.api is required when ingress.enabled=true" .Values.ingress.hosts.api | quote }}
      http:
        paths:
          - path: /exam/[^/]+/terminal
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ include "kubecert.terminalGatewayName" . }}
                port:
                  name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "kubecert.examWebName" . }}
  labels:
    {{- include "kubecert.labels" . | nindent 4 }}
    app.kubernetes.io/component: exam-web
  annotations:
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className | quote }}
  {{- end }}
  {{- if and .Values.ingress.tls.enabled .Values.ingress.tls.secretName }}
  tls:
    - secretName: {{ .Values.ingress.tls.secretName | quote }}
      hosts:
        - {{ .Values.ingress.hosts.exam | quote }}
  {{- end }}
  rules:
    - host: {{ required "ingress.hosts.exam is required when ingress.enabled=true" .Values.ingress.hosts.exam | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "kubecert.examWebName" . }}
                port:
                  name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "kubecert.adminWebName" . }}
  labels:
    {{- include "kubecert.labels" . | nindent 4 }}
    app.kubernetes.io/component: admin-web
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className | quote }}
  {{- end }}
  {{- if and .Values.ingress.tls.enabled .Values.ingress.tls.secretName }}
  tls:
    - secretName: {{ .Values.ingress.tls.secretName | quote }}
      hosts:
        - {{ .Values.ingress.hosts.admin | quote }}
  {{- end }}
  rules:
    - host: {{ required "ingress.hosts.admin is required when ingress.enabled=true" .Values.ingress.hosts.admin | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "kubecert.adminWebName" . }}
                port:
                  name: http
{{- end }}
