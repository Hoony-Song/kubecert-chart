# Public placeholder production override.
# Keep real production values outside this public repository.

secrets:
  admin:
    existingSecret: kubecert-admin
  runtimeSsh:
    existingSecret: kubecert-runtime-ssh
  terminalSsh:
    existingSecret: kubecert-terminal-ssh

postgresql:
  enabled: false
  mode: external
  external:
    host: postgres.example.internal
    database: kubecert
    existingSecret: kubecert-postgresql
  auth:
    existingSecret: kubecert-postgresql
    username: kubecert
    database: kubecert
    passwordKey: password

redis:
  enabled: false
  mode: external
  external:
    host: redis.example.internal
    existingSecret: kubecert-redis
  auth:
    existingSecret: kubecert-redis
    passwordKey: password

keda:
  mode: external
kedaOperator:
  enabled: false

ingress:
  enabled: true
  className: nginx
  baseHost: example.com
  subdomains:
    exam: www
    admin: admin
    api: api
    terminal: terminal
  sameOriginApi:
    enabled: false
  tls:
    enabled: true
    secretName: kubecert-tls
