# Public placeholder development override.
# Copy to a private location and replace every placeholder before use.

images:
  api:
    repository: example.registry.local/kubecert-api
    tag: dev-placeholder
  worker:
    repository: example.registry.local/kubecert-api
    tag: dev-placeholder
  terminalGateway:
    repository: example.registry.local/kubecert-api
    tag: dev-placeholder
  examWeb:
    repository: example.registry.local/kubecert-exam-web
    tag: dev-placeholder
  adminWeb:
    repository: example.registry.local/kubecert-admin-web
    tag: dev-placeholder

config:
  publicApiUrl: https://api.dev.example.com
  artifactBaseUrl: https://artifacts.dev.example.com
  runtimeNodeInstallerUrl: https://artifacts.dev.example.com/runtime/installer/install.sh
  runtimeNodeManifestUrl: https://artifacts.dev.example.com/runtime/manifests/runtime-node-dev.json
  frontend:
    examApiBaseUrl: https://api.dev.example.com
    adminApiBaseUrl: https://api.dev.example.com

postgresql:
  mode: bundled

redis:
  mode: bundled

keda:
  mode: bundled

questionBank:
  artifactUrl: https://artifacts.dev.example.com/runtime/question-bank/kubecert-question-bank-dev.tar.gz
  artifactSha256: replace-with-dev-sha256

ingress:
  enabled: true
  className: nginx
  hosts:
    exam: exam.dev.example.com
    admin: admin.dev.example.com
    api: api.dev.example.com
