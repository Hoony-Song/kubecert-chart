# Public placeholder development override.
# Development environments normally override image tags while using the official
# image repositories and question-bank artifact from the chart defaults.

images:
  api:
    tag: v1.1.0-dev.20260526.r1
  worker:
    tag: v1.1.0-dev.20260526.r1
  terminalGateway:
    tag: v1.1.0-dev.20260526.r1
  examWeb:
    tag: v1.1.0-dev.20260526.r1
  adminWeb:
    tag: v1.1.0-dev.20260526.r1

secrets:
  admin:
    existingSecret: kubecert-admin
  runtimeSsh:
    existingSecret: kubecert-runtime-ssh
  terminalSsh:
    existingSecret: kubecert-terminal-ssh

postgresql:
